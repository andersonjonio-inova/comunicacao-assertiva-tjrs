<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111915">
  <title>Encerramento | Comunicação Assertiva</title>
  <meta name="description" content="Memória de encerramento do curso Comunicação Assertiva no TJRS.">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="deck" aria-label="Apresentação de encerramento">
    <section class="slide title-slide active" aria-label="Abertura">
      <img class="opening-photo" src="assets/foto-abertura.jpg" alt="Participantes atentos durante o curso Comunicação Assertiva">
      <div class="title-copy">
        <p class="kicker">Comunicação Assertiva</p>
        <h1>O que permanece<br>é o encontro.</h1>
        <p class="subtitle">Uma memória feita de presença, escuta e pessoas.</p>
      </div>
    </section>

    <section class="slide quote-slide" data-quote="Antes de toda palavra, existe uma presença.">
      <figure class="portrait"><img src="assets/fotos/01.jpg" alt="Participantes durante a formação"></figure>
      <figure class="portrait second"><img src="assets/fotos/02.jpg" alt="Participantes em atividade no curso"></figure>
    </section>
    <section class="slide quote-slide align-right" data-quote="Quando alguém se sente visto, a conversa já começou a mudar.">
      <figure class="portrait"><img src="assets/fotos/03.jpg" alt="Registro de participação no curso"></figure>
      <figure class="portrait second"><img src="assets/fotos/04.jpg" alt="Momento de troca entre participantes"></figure>
    </section>
    <section class="slide panorama" data-quote="Conectar é estar inteiro onde a vida acontece.">
      <img src="assets/fotos/05.jpg" alt="Turma reunida durante a formação">
    </section>
    <section class="slide quote-slide" data-quote="Escutar é oferecer espaço para que o outro também exista.">
      <figure class="portrait"><img src="assets/fotos/06.jpg" alt="Participante em momento de escuta"></figure>
      <figure class="portrait second"><img src="assets/fotos/07.jpg" alt="Participante durante dinâmica do curso"></figure>
    </section>
    <section class="slide quote-slide align-right" data-quote="Toda conversa difícil pode guardar uma necessidade querendo ser compreendida.">
      <figure class="portrait"><img src="assets/fotos/08.jpg" alt="Registro de atividade em grupo"></figure>
      <figure class="portrait second"><img src="assets/fotos/09.jpg" alt="Participante compartilhando uma reflexão"></figure>
    </section>
    <section class="slide quote-slide" data-quote="Presença não é silêncio. É atenção com intenção.">
      <figure class="portrait"><img src="assets/fotos/10.jpg" alt="Momento de concentração durante o curso"></figure>
      <figure class="portrait second"><img src="assets/fotos/11.jpg" alt="Participante envolvido em atividade"></figure>
    </section>
    <section class="slide quote-slide align-right" data-quote="As palavras criam caminhos. A forma como chegamos ao outro decide quais deles se abrem.">
      <figure class="portrait"><img src="assets/fotos/12.jpg" alt="Participante durante a formação"></figure>
      <figure class="portrait second"><img src="assets/fotos/13.jpg" alt="Registro de aprendizagem compartilhada"></figure>
    </section>
    <section class="slide quote-slide" data-quote="Acordos duradouros começam quando as pessoas importam tanto quanto o resultado.">
      <figure class="portrait"><img src="assets/fotos/14.jpg" alt="Participante em atividade do curso"></figure>
      <figure class="portrait second"><img src="assets/fotos/15.jpg" alt="Momento de diálogo entre participantes"></figure>
    </section>
    <section class="slide quote-slide align-right" data-quote="Não levamos apenas ferramentas. Levamos novas possibilidades de encontro.">
      <figure class="portrait"><img src="assets/fotos/16.jpg" alt="Participante registrando aprendizados"></figure>
      <figure class="portrait second"><img src="assets/fotos/17.jpg" alt="Registro de presença no curso"></figure>
    </section>
    <section class="slide quote-slide" data-quote="Onde existe curiosidade, o julgamento perde força.">
      <figure class="portrait"><img src="assets/fotos/18.jpg" alt="Participante durante reflexão"></figure>
      <figure class="portrait second"><img src="assets/fotos/19.jpg" alt="Momento de aprendizagem no curso"></figure>
    </section>
    <section class="slide quote-slide align-right" data-quote="Onde existe coragem, a honestidade pode caminhar junto com o cuidado.">
      <figure class="portrait"><img src="assets/fotos/20.jpg" alt="Participante em dinâmica de comunicação"></figure>
      <figure class="portrait second"><img src="assets/fotos/21.jpg" alt="Registro de troca durante a formação"></figure>
    </section>
    <section class="slide quote-slide" data-quote="Onde existe escuta, diferenças podem se transformar em entendimento.">
      <figure class="portrait"><img src="assets/fotos/22.jpg" alt="Participante acompanhando a atividade"></figure>
      <figure class="portrait second"><img src="assets/fotos/23.jpg" alt="Participante em momento de diálogo"></figure>
    </section>
    <section class="slide quote-slide align-right" data-quote="Comunicar é mais do que dizer. É cuidar do que acontece entre nós.">
      <figure class="portrait"><img src="assets/fotos/24.jpg" alt="Registro de participante do curso"></figure>
      <figure class="portrait second"><img src="assets/fotos/25.jpg" alt="Momento de conexão durante a formação"></figure>
    </section>
    <section class="slide quote-slide" data-quote="Cada pessoa trouxe uma história. Juntas, elas criaram esta experiência.">
      <figure class="portrait"><img src="assets/fotos/26.jpg" alt="Participante compartilhando a experiência"></figure>
      <figure class="portrait second"><img src="assets/fotos/27.jpg" alt="Participante em atividade colaborativa"></figure>
    </section>
    <section class="slide quote-slide align-right" data-quote="Que a técnica vire prática. Que a prática vire cultura. Que a cultura preserve pessoas.">
      <figure class="portrait"><img src="assets/fotos/28.jpg" alt="Registro de aprendizagem no curso"></figure>
      <figure class="portrait second"><img src="assets/fotos/29.jpg" alt="Participante durante o encontro"></figure>
    </section>
    <section class="slide quote-slide" data-quote="O curso termina. A qualidade das nossas conversas continua.">
      <figure class="portrait"><img src="assets/fotos/30.jpg" alt="Participante durante o encerramento"></figure>
      <figure class="portrait second"><img src="assets/fotos/31.jpg" alt="Registro do encontro formativo"></figure>
    </section>
    <section class="slide panorama" data-quote="Seguimos capazes de construir acordos de paz.">
      <img src="assets/fotos/32.jpg" alt="Registro coletivo da formação">
    </section>
    <section class="slide final-slide" aria-label="Agradecimento final">
      <img src="assets/foto-final-turma.jpg" alt="Turma e facilitadores reunidos ao final do curso">
      <div class="final-copy">
        <p class="kicker">Obrigado</p>
        <h2>Obrigado por construírem conosco um espaço de escuta, presença e conexão.</h2>
        <p>Que cada conversa daqui em diante abra caminhos para acordos de paz.</p>
      </div>
    </section>
  </main>

  <div class="controls" aria-label="Controles da apresentação">
    <button id="previous" type="button" aria-label="Slide anterior">‹</button>
    <button id="play" type="button" aria-pressed="false">Iniciar</button>
    <button id="next" type="button" aria-label="Próximo slide">›</button>
    <span id="counter" aria-live="polite">1 / 19</span>
    <label class="audio-button" for="audio-file">Carregar trilha</label>
    <input id="audio-file" type="file" accept="audio/*">
    <button id="fullscreen" type="button">Tela cheia</button>
  </div>
  <audio id="soundtrack" preload="metadata"></audio>
</body>
</html>
